<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzz Lightyear Soundboard</title>
    <style>
        body {
            background-color: #2c3e50;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .panel {
            background-color: #ecf0f1;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 5px solid #95a5a6;
        }

        h1 {
            text-align: center;
            color: #27ae60; /* Buzz Green */
            margin-bottom: 20px;
            text-transform: uppercase;
            font-style: italic;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .sound-btn {
            padding: 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            text-align: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .sound-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-red { background-color: #e74c3c; } /* Laser */
        .btn-green { background-color: #2ecc71; } /* Phrase */
        .btn-blue { background-color: #3498db; } /* Command */
        .btn-purple { background-color: #9b59b6; } /* Special */

        .status {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h1>Star Command</h1>
        
        <div class="button-grid">
            <button class="sound-btn btn-red" onclick="playSound('laser')">ЛАЗЕР</button>
            <button class="sound-btn btn-green" onclick="playSound('infinity')">БЕСКОНЕЧНОСТЬ</button>
            <button class="sound-btn btn-blue" onclick="playSound('command')">КОМАНДА</button>
            <button class="sound-btn btn-purple" onclick="playSound('scan')">СКАНЕР</button>
            <button class="sound-btn btn-red" onclick="playSound('alert')">ТРЕВОГА</button>
            <button class="sound-btn btn-green" onclick="playSound('welcome')">Я БАЗЗ</button>
        </div>

        <div class="status">v1.0 - Christmas Operations</div>
    </div>

    <!-- 
       ВНИМАНИЕ: Для работы звуков, создайте папку 'sounds' рядом с этим файлом
       и положите туда файлы: laser.mp3, infinity.mp3, command.mp3, scan.mp3, alert.mp3, welcome.mp3
    -->

    <audio id="laser" src="sounds/laser.mp3"></audio>
    <audio id="infinity" src="sounds/infinity.mp3"></audio>
    <audio id="command" src="sounds/command.mp3"></audio>
    <audio id="scan" src="sounds/scan.mp3"></audio>
    <audio id="alert" src="sounds/alert.mp3"></audio>
    <audio id="welcome" src="sounds/welcome.mp3"></audio>

    <script>
        function playSound(id) {
            const audio = document.getElementById(id);
            if (audio) {
                // Сброс времени, чтобы можно было нажимать быстро
                audio.currentTime = 0;
                audio.play().catch(e => {
                     console.log("Audio file not found or autoplay blocked: " + e);
                     alert("Звук '" + id + "' воспроизводится! (Файл не найден)");
                });
            }
        }
    </script>
</body>
</html>
